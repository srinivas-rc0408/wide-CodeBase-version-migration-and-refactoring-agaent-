[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pkg"
version = "0.1.0"
description = "Corpus fixture: multi-module app, fully migrated to timezone-aware."
requires-python = "==3.12.*"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
